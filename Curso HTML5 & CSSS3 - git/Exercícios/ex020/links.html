<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizando Links</title>
    <style>

        /*   Seletores Personalizados
            # =   id
            . =   class
            : =   pseudo-class
            :: =  pseudo element
            > =   children
        */

        body {
            font-family: 'Courier New', Courier, monospace;
        }

        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: darkred;
        }

        a:hover {
            color: black;
            text-decoration: underline;
        }

        a:active {
            color: yellow;
        }

        a::after {
            content: '[link]';
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/luvzke" target="_blank">GitHub</a></li>
        <li><a href="https://www.instagram.com/luvzke/" target="_blank">Instagram</a></li>
        <li><a href="https://www.linkedin.com/in/luvzke/" target="_blank">LinkedIn</a></li>
    </ul>
    
</body>
</html>
